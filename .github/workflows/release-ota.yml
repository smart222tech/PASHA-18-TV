name: Publish signed PASHXXX OTA release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PASHXXX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PASHXXX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PASHXXX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PASHXXX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing PASHXXX_KEYSTORE_BASE64 secret"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing PASHXXX_KEYSTORE_PASSWORD secret"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing PASHXXX_KEY_ALIAS secret"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing PASHXXX_KEY_PASSWORD secret"; exit 1)
      - name: Decode permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PASHXXX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pashxxx-release.jks"
      - name: Calculate Android version code
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        env:
          PASHXXX_VERSION_NAME: ${{ steps.version.outputs.version }}
          PASHXXX_VERSION_CODE: ${{ steps.version.outputs.code }}
          PASHXXX_KEYSTORE_PATH: ${{ runner.temp }}/pashxxx-release.jks
          PASHXXX_KEYSTORE_PASSWORD: ${{ secrets.PASHXXX_KEYSTORE_PASSWORD }}
          PASHXXX_KEY_ALIAS: ${{ secrets.PASHXXX_KEY_ALIAS }}
          PASHXXX_KEY_PASSWORD: ${{ secrets.PASHXXX_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Rename APK and generate checksum
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="PASHXXX-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "$SHA256  $APK" > SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PASHXXX v${{ steps.package.outputs.version }}
          generate_release_notes: true
          body: |
            PASHXXX Android release.
            SHA256: ${{ steps.package.outputs.sha256 }}
          files: |
            PASHXXX-v${{ steps.package.outputs.version }}.apk
            SHA256SUMS.txt
